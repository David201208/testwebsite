[build]
  publish = "."

# Inject the IPAPI_TOKEN env variable into the HTML at build time
[[plugins]]
  package = "@netlify/plugin-replace"

  [plugins.inputs]
    [plugins.inputs.replacements]
      "__IPAPI_TOKEN__" = "IPAPI_TOKEN"

# Optional: security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
